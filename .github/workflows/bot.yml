name: News Bot

on:
  schedule:
    # هر اجرا حدود ۵۰ دقیقه روشن می‌ماند و هر ۱ دقیقه یک پست می‌فرستد؛
    # اجرای بعدی در صف می‌ماند تا قبلی تمام شود، پس ربات تقریبا پیوسته کار می‌کند.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "ارسال پیام تست هشدار"
        type: boolean
        default: false
      skip_backlog:
        description: "رد کردن همه پست‌های در صف (بدون ارسال)"
        type: boolean
        default: false
      test_tweet:
        description: "همین حالا یک توییت پربازدید فارسی بفرست (تست)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # کتابخانه‌ی چیدمان راست‌به‌چپ برای نوشتن فارسی روی استیکر صبح بخیر
      - name: Text shaping library
        run: ldconfig -p | grep -q libfribidi || (sudo apt-get update -qq && sudo apt-get install -y -qq libfribidi0)

      - name: Run bot
        id: bot
        timeout-minutes: 60
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_FOOTER: ${{ vars.CHANNEL_FOOTER }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert == 'true' && 'true' || vars.TEST_ALERT }}
          SKIP_BACKLOG: ${{ github.event.inputs.skip_backlog == 'true' && 'true' || '' }}
          POST_INTERVAL_MIN: ${{ vars.POST_INTERVAL_MIN }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          RUN_MINUTES: ${{ vars.RUN_MINUTES }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TWEET_MIN_LIKES: ${{ vars.TWEET_MIN_LIKES }}
          TEST_TWEET: ${{ github.event.inputs.test_tweet == 'true' && 'true' || '' }}
        run: python -u bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json docs
          git diff --staged --quiet || (git commit -m "update state" && (git push || (git pull --rebase origin main && git push)))

      # اجرای بعدی را خود ربات شروع می‌کند (زمان‌بندی گیتهاب گاهی ساعت‌ها اجرا نمی‌شود).
      # اگر ربات خطا داد، ۵ دقیقه صبر و بعد دوباره شروع (تا ربات هیچ‌وقت متوقف نماند).
      # اجرایی که دستی کنسل شده، اجرای بعدی را شروع نمی‌کند.
      - name: Start next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_FAILED: ${{ steps.bot.outcome == 'failure' }}
        run: |
          if [ "$BOT_FAILED" = "true" ]; then echo "bot failed; waiting 5 min before restarting"; sleep 300; fi
          gh workflow run bot.yml --ref main -R ${{ github.repository }}
