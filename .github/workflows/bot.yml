name: News Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "ارسال پیام تست هشدار"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        env:
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_FOOTER: ${{ vars.CHANNEL_FOOTER }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          TEST_ALERT: ${{ github.event.inputs.test_alert == 'true' && 'true' || vars.TEST_ALERT }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state" && git push)
