name: Gold Signal

on:
  schedule:
    # پشتیبان؛ اجرای اصلی را خود ربات بعد از هر اجرا شروع می‌کند (زمان‌بندی گیتهاب قابل اعتماد نیست)
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "فقط پیام تست بفرست (وضعیت فعلی + نمونه پیام سیگنال)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.event.inputs.test == 'true' && 'gold-test' || 'gold-signal' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests websocket-client

      - name: Run gold signal bot
        id: gold
        timeout-minutes: 345
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
          GOLD_CHAT_ID: ${{ vars.GOLD_CHAT_ID }}
          TV_SYMBOL: ${{ vars.TV_SYMBOL }}
          GOLD_ACCOUNT_USC: ${{ vars.GOLD_ACCOUNT_USC }}
          GOLD_TEST: ${{ github.event.inputs.test == 'true' && 'true' || '' }}
        run: python -u gold_signal.py

      - name: Save state
        if: ${{ always() && github.event.inputs.test != 'true' }}
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add gold_state.json
          git diff --staged --quiet || (git commit -m "update gold state" && (git push || (git pull --rebase origin main && git push) || (sleep 10 && git pull --rebase origin main && git push)))

      - name: Start next run
        if: ${{ !cancelled() && github.event.inputs.test != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_FAILED: ${{ steps.gold.outcome == 'failure' }}
        run: |
          if [ "$BOT_FAILED" = "true" ]; then echo "bot failed; waiting 5 min before restarting"; sleep 300; fi
          gh workflow run gold.yml --ref main -R ${{ github.repository }}
